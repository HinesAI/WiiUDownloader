name: Upstream check

on:
  schedule:
    # 1st of each month at 14:00 UTC
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare with upstream
        id: compare
        run: |
          chmod +x scripts/check-upstream.sh
          scripts/check-upstream.sh | tee upstream-report.txt
          status=$(grep -E '^status=' upstream-report.txt | tail -1 | cut -d= -f2- || echo unknown)
          ahead=$(grep -E '^upstream_commits_since_base=' upstream-report.txt | tail -1 | cut -d= -f2- || echo 0)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          {
            echo "## Upstream check"
            echo
            echo "- Status: \`$status\`"
            echo "- Upstream commits since merge-base: \`$ahead\`"
            echo
            echo "<details><summary>Full report</summary>"
            echo
            echo '```'
            cat upstream-report.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: upstream-report.txt
          if-no-files-found: error

      - name: Update tracking issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS="${{ steps.compare.outputs.status }}"
          AHEAD="${{ steps.compare.outputs.ahead }}"
          LABEL="upstream-sync"
          REPORT_FILE=upstream-report.txt
          REPO="${{ github.repository }}"

          {
            echo "## Monthly upstream check"
            echo
            echo "Automated compare of **HinesAI/WiiUDownloader** against **Xpl0itU/WiiUDownloader**."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Status | \`${STATUS}\` |"
            echo "| Upstream commits since merge-base | \`${AHEAD}\` |"
            echo "| Checked at | $(date -u +%Y-%m-%dT%H:%MZ) |"
            echo "| Workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo
            echo "### What to do"
            echo "1. Skim the commit list and diffstat below."
            echo "2. Choose **merge**, **selective port**, or **skip**."
            echo "3. Comment the decision on this issue (and link a PR if you open one)."
            echo "4. Close when the review is done for this month."
            echo
            echo "**Merge** if changes are compatible with our fork (UI/branding/CI)."
            echo "**Port** individual fixes/features when a full merge would be noisy or conflicting."
            echo "**Skip** if nothing relevant."
            echo
            echo "<details>"
            echo "<summary>Upstream report</summary>"
            echo
            echo '```'
            cat "$REPORT_FILE"
            echo '```'
            echo
            echo "</details>"
          } > issue-body.md

          # Prefer commenting on an existing upstream-sync issue (Actions often cannot create issues).
          EXISTING=$(gh api "repos/${REPO}/issues?state=open&labels=${LABEL}&per_page=1" --jq '.[0].number // empty')
          if [[ -z "$EXISTING" ]]; then
            echo "No open #${LABEL} issue found; skipping issue update."
            echo "Create one once (see docs/UPSTREAM.md), or set secret UPSTREAM_CHECK_TOKEN with issues:write."
            exit 0
          fi

          gh api --method POST "repos/${REPO}/issues/${EXISTING}/comments" \
            -F body=@issue-body.md
          echo "Commented on issue #${EXISTING}"
